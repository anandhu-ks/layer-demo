<html>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script
    id="context"
    type="text/javascript"
    src="https://preprod-payments-layer.open.money/layer.js"
  ></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      width: 420px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      padding: 28px 32px;
      color: #fff;
    }

    .merchant-logo {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      font-weight: 700;
      font-size: 16px;
      color: #1a1a2e;
    }

    .merchant-name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 4px;
    }

    .amount {
      font-size: 36px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .amount span {
      font-size: 20px;
      font-weight: 400;
      margin-right: 4px;
      opacity: 0.8;
    }

    .card-body {
      padding: 28px 32px;
    }

    .order-details {
      margin-bottom: 24px;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: #888;
    }

    .detail-value {
      color: #111;
      font-weight: 500;
    }

    .detail-value.status {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
    }

    .pay-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0052cc, #0066ff);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition:
        opacity 0.2s,
        transform 0.1s;
    }

    .pay-btn:hover {
      opacity: 0.92;
    }

    .pay-btn:active {
      transform: scale(0.98);
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 16px;
      font-size: 12px;
      color: #aaa;
    }

    .secure-badge svg {
      opacity: 0.6;
    }
  </style>

  <body>
    <div class="card">
      <div class="card-header">
        <div class="merchant-logo">BO</div>
        <div class="merchant-name">BankOpen Store</div>
      </div>
      <div class="card-body">
        <div class="order-details">
          <div class="detail-row">
            <span class="detail-label">Order ID</span>
            <span class="detail-value">#ORD-20240001</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Item</span>
            <span class="detail-value">Premium Plan (1 month)</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Customer</span>
            <span class="detail-value">John Doe</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value status">Pending</span>
          </div>
        </div>

        <button class="pay-btn" onclick="startCheckout()">Pay Now</button>

        <div class="secure-badge">
          <svg width="12" height="14" viewBox="0 0 12 14" fill="none">
            <path
              d="M6 0L0 2.5V7c0 3.3 2.6 6.3 6 7 3.4-.7 6-3.7 6-7V2.5L6 0z"
              fill="#aaa"
            />
          </svg>
          Secured by Layer · Open Money
        </div>
      </div>
    </div>

    <script>
      function startCheckout() {
        Layer.checkout(
          {
            token: "pt_E86a0d840A81B3B",
            accesskey: "4d1e1de0-62f3-42ec-a789-5c3f495ff406",
            theme: {
              logo: "",
              color: "#dc2626",
              error_color: "#dc2626",
            },
          },
          function (response) {
            console.log(response);
            if (response.status == "captured") {
              window.location.href = "success_redirect_url";
            } else if (response.status == "created") {
            } else if (response.status == "pending") {
            } else if (response.status == "failed") {
              window.location.href = "failure_redirect_url";
            } else if (response.status == "cancelled") {
              window.location.href = "cancel_redirect_url";
            }
          },
          function (err) {
            console.error(err);
          },
        );
      }
    </script>
  </body>
</html>
